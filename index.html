<div id="visitor-counter" class="visitor-counter">

    <div class="visitor-info">
        <span id="visitorCount">...</span>
        <span class="visitor-label">TOTAL VISITS</span>
    </div>
</div>

<script>
(async function () {
    const output = document.getElementById('visitorCount');
    if (!output) return;

    try {
        const response = await fetch(
            'https://flugerok.goatcounter.com/counter/TOTAL.json'
        );

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();
        output.textContent = data.count;
    } catch (error) {
        output.textContent = '—';
        console.error('GoatCounter:', error);
    }
})();
</script>
